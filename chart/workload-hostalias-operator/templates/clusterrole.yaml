apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "workload-hostalias-operator.fullname" . }}-manager-role
  labels:
    {{- include "workload-hostalias-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - apps
    resources:
      - daemonsets
      - deployments
      - statefulsets
    verbs:
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - workload-hostalias-operator.buzhiyun
    resources:
      - workloadhostaliases
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - workload-hostalias-operator.buzhiyun
    resources:
      - workloadhostaliases/finalizers
    verbs:
      - update
  - apiGroups:
      - workload-hostalias-operator.buzhiyun
    resources:
      - workloadhostaliases/status
    verbs:
      - get
      - patch
      - update
